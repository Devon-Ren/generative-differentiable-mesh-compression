<text x="930" y="62" font-size="12" fill="#52514e" text-anchor="end" font-weight="normal" font-style="normal">input: images + target size (MB)</text>
<rect x="962" y="40" width="356" height="400" rx="12" fill="#f7f7f4" stroke="#c9c8c2" stroke-width="1.3"/>
<text x="976" y="62" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold" font-style="normal">2  Encoding</text>
<rect x="1336" y="40" width="150" height="400" rx="12" fill="#f7f7f4" stroke="#c9c8c2" stroke-width="1.3"/>
<text x="1350" y="62" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold" font-style="normal">3  Decoding</text>
<rect x="30" y="96" width="150" height="150" rx="8" fill="#e9e8e3" stroke="#8a8983" stroke-width="1.3"/>
<polygon points="48,130 78,112 70,150" fill="#cfcec8" stroke="#52514e" stroke-width="1"/>
<polygon points="96,122 140,110 128,140" fill="#cfcec8" stroke="#52514e" stroke-width="1"/>
<polygon points="52,190 76,168 92,204" fill="#cfcec8" stroke="#52514e" stroke-width="1"/>
<polygon points="112,170 160,160 150,196" fill="#cfcec8" stroke="#52514e" stroke-width="1"/>
<polygon points="100,214 126,206 120,232" fill="#cfcec8" stroke="#52514e" stroke-width="1"/>
<polygon points="142,214 168,224 150,238" fill="#cfcec8" stroke="#52514e" stroke-width="1"/>
<text x="105" y="266" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal">Triangle soup</text>
<text x="105" y="283" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal">as in MeshSplatting</text>
<line x1="182" y1="171" x2="212" y2="171" stroke="#0b0b0b" stroke-width="1.6" marker-end="url(#a0b0b0b)"/>
<rect x="214" y="96" width="196" height="150" rx="8" fill="#e6f0fc" stroke="#2a78d6" stroke-width="1.3"/>
<polygon points="236,150 300,118 292,190" fill="#cfcec8" stroke="#52514e" stroke-width="1"/>
<line x1="306" y1="154" x2="326" y2="154" stroke="#52514e" stroke-width="1.2" marker-end="url(#a52514e)"/>
<polygon points="332,150 364,134 360,170" fill="#b7d3f6" stroke="#2a78d6" stroke-width="1"/>
<polygon points="364,134 396,118 392,154" fill="#b7d3f6" stroke="#2a78d6" stroke-width="1"/>
<polygon points="360,170 392,154 388,190" fill="#b7d3f6" stroke="#2a78d6" stroke-width="1"/>
<polygon points="364,134 392,154 360,170" fill="#b7d3f6" stroke="#2a78d6" stroke-width="1"/>
<text x="312" y="222" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal">split where error drops</text>
<text x="312" y="236" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal">most per byte</text>
<text x="312" y="266" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal">Grow</text>
<text x="312" y="283" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal">iterations 0 to 10k</text>
<text x="312" y="298" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal">how many: planned from</text>
<text x="312" y="313" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal">the measured size</text>
<line x1="412" y1="171" x2="442" y2="171" stroke="#0b0b0b" stroke-width="1.6" marker-end="url(#a0b0b0b)"/>
<rect x="444" y="96" width="150" height="150" rx="8" fill="#e9e8e3" stroke="#8a8983" stroke-width="1.3"/>
<polygon points="462,200 500,128 540,196" fill="#cfcec8" stroke="#52514e" stroke-width="1"/>
<polygon points="500,128 576,132 540,196" fill="#cfcec8" stroke="#52514e" stroke-width="1"/>
<polygon points="462,200 540,196 520,232" fill="#cfcec8" stroke="#52514e" stroke-width="1"/>
<polygon points="470,150 500,128 462,200" fill="#cfcec8" stroke="#52514e" stroke-width="1"/>
<text x="519" y="266" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal">Connect</text>
<text x="519" y="283" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal">restricted Delaunay</text>
<text x="519" y="298" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal">at 11k, as in MeshSplatting</text>
<line x1="596" y1="171" x2="626" y2="171" stroke="#0b0b0b" stroke-width="1.6" marker-end="url(#a0b0b0b)"/>
<rect x="628" y="84" width="300" height="262" rx="8" fill="#e6f0fc" stroke="#2a78d6" stroke-width="1.3"/>
<text x="778" y="104" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal">Hold at the target</text>
<text x="778" y="119" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal">every 500 iterations, 12.5k to 29.5k</text>
<rect x="644" y="134" width="118" height="44" rx="8" fill="white" stroke="#2a78d6" stroke-width="1.3"/>
<text x="703" y="152" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" font-style="normal">encode the</text>
<text x="703" y="167" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" font-style="normal">current mesh</text>
<rect x="794" y="134" width="118" height="44" rx="8" fill="white" stroke="#2a78d6" stroke-width="1.3"/>
<text x="853" y="152" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" font-style="normal">file size</text>
<text x="853" y="167" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" font-style="normal">above target?</text>
<rect x="794" y="222" width="118" height="56" rx="8" fill="white" stroke="#2a78d6" stroke-width="1.3"/>
<text x="853" y="240" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" font-style="normal">collapse edges</text>
<text x="853" y="255" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" font-style="normal">worth that many</text>
<text x="853" y="270" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" font-style="normal">bytes</text>
<rect x="644" y="222" width="118" height="56" rx="8" fill="white" stroke="#2a78d6" stroke-width="1.3"/>
<text x="703" y="246" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" font-style="normal">keep training</text>
<text x="703" y="261" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" font-style="normal">500 iterations</text>
<line x1="764" y1="156" x2="792" y2="156" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#a2a78d6)"/>
<line x1="853" y1="180" x2="853" y2="220" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#a2a78d6)"/>
<line x1="792" y1="250" x2="764" y2="250" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#a2a78d6)"/>
<line x1="703" y1="220" x2="703" y2="180" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#a2a78d6)"/>
<text x="862" y="204" font-size="11" fill="#2a78d6" text-anchor="start" font-weight="normal" font-style="normal">yes</text>
<path d="M 794 168 Q 760 200 742 220" fill="none" stroke="#2a78d6" stroke-width="1.2" marker-end="url(#a2a78d6)" stroke-dasharray="4 3"/>
<text x="752" y="198" font-size="11" fill="#2a78d6" text-anchor="end" font-weight="normal" font-style="normal">no</text>
<text x="778" y="300" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal">cheapest edges first: least error per byte freed</text>
<text x="778" y="315" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal">only collapses that do not fold the surface</text>
<text x="778" y="336" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" font-style="italic">the mesh stays at the target size while it trains</text>
<line x1="30" y1="392" x2="928" y2="392" stroke="#8a8983" stroke-width="1.2"/>
<line x1="30" y1="386" x2="30" y2="398" stroke="#8a8983" stroke-width="1.2"/>
<text x="30" y="414" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" font-style="normal">0</text>
<line x1="411" y1="386" x2="411" y2="398" stroke="#8a8983" stroke-width="1.2"/>
<text x="411" y="414" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal">10k</text>
<line x1="444" y1="386" x2="444" y2="398" stroke="#8a8983" stroke-width="1.2"/>
<text x="444" y="414" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal">11k</text>
<line x1="628" y1="386" x2="628" y2="398" stroke="#8a8983" stroke-width="1.2"/>
<text x="628" y="414" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal">12.5k</text>
<line x1="928" y1="386" x2="928" y2="398" stroke="#8a8983" stroke-width="1.2"/>
<text x="928" y="414" font-size="11" fill="#52514e" text-anchor="end" font-weight="normal" font-style="normal">30k</text>
<text x="479" y="430" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal">training iterations (the mesh becomes fully opaque by 24k)</text>
<rect x="978" y="96" width="150" height="46" rx="8" fill="#e9e8e3" stroke="#8a8983" stroke-width="1.3"/>
<text x="1053" y="115" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="normal" font-style="normal">fine-tune</text>
<text x="1053" y="131" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal">3,000 steps</text>
<line x1="1053" y1="144" x2="1053" y2="164" stroke="#0b0b0b" stroke-width="1.6" marker-end="url(#a0b0b0b)"/>
<rect x="978" y="166" width="150" height="120" rx="8" fill="#e6f0fc" stroke="#2a78d6" stroke-width="1.3"/>
<text x="1053" y="184" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal">shared colour codebook</text>
<rect x="990" y="196" width="58" height="40" rx="8" fill="white" stroke="#2a78d6" stroke-width="1.3"/>
<text x="1019" y="213" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal" font-style="normal">main</text>
<text x="1019" y="228" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal">4,096</text>
<rect x="1058" y="196" width="58" height="40" rx="8" fill="white" stroke="#2a78d6" stroke-width="1.3"/>
<text x="1087" y="213" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal" font-style="normal">residual</text>
<text x="1087" y="228" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal">256</text>
<text x="1053" y="256" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal">per vertex: base colour</text>
<text x="1053" y="271" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal">+ two indices</text>
<line x1="1130" y1="226" x2="1160" y2="226" stroke="#0b0b0b" stroke-width="1.6" marker-end="url(#a0b0b0b)"/>
<polygon points="1162,110 1248,161.04 1248,290.96 1162,342" fill="#e6f0fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="1205" y="222" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal">Encoder</text>
<text x="1205" y="242" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal">connectivity</text>
<text x="1205" y="257" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal">positions</text>
<text x="1205" y="272" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal">base colour</text>
<text x="1205" y="287" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal">indices</text>
<line x1="1250" y1="226" x2="1272" y2="226" stroke="#0b0b0b" stroke-width="1.6" marker-end="url(#a0b0b0b)"/>
<rect x="1274" y="196" width="34" height="60" rx="3" fill="white" stroke="#0b0b0b" stroke-width="1.3"/>
<text x="1291" y="222" font-size="10.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" font-style="normal">one</text>
<text x="1291" y="236" font-size="10.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" font-style="normal">file</text>
<text x="1145" y="372" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal">every stream has its own lossless coder;</text>
<text x="1145" y="387" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal">the same encoder measures the size during training</text>
<path d="M 1205 344 L 1205 356 L 703 356 L 703 372" fill="none" stroke="#eb6834" stroke-width="1.4" stroke-dasharray="5 3"/>
<path d="M 703 372 L 703 350" fill="none" stroke="#eb6834" stroke-width="1.4" marker-end="url(#aeb6834)" stroke-dasharray="5 3"/>
<text x="954" y="351" font-size="11" fill="#eb6834" text-anchor="middle" font-weight="normal" font-style="normal">same encoder</text>
<line x1="1310" y1="226" x2="1350" y2="226" stroke="#0b0b0b" stroke-width="1.6" marker-end="url(#a0b0b0b)"/>
<polygon points="1352,183.44 1422,150 1422,302 1352,268.56" fill="#e6f0fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="1387" y="231" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal">Decoder</text>
<line x1="1387" y1="304" x2="1387" y2="330" stroke="#0b0b0b" stroke-width="1.6" marker-end="url(#a0b0b0b)"/>
<rect x="1350" y="332" width="122" height="46" rx="8" fill="#e9e8e3" stroke="#8a8983" stroke-width="1.3"/>
<text x="1411" y="351" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" font-style="normal">mesh, rendered</text>
<text x="1411" y="366" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" font-style="normal">as usual</text>
<text x="1411" y="96" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal">needs only the file,</text>
<text x="1411" y="111" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal">CPU only</text>
<rect x="30" y="8" width="16" height="14" rx="3" fill="#e6f0fc" stroke="#2a78d6" stroke-width="1.3"/>
<text x="52" y="20" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-style="normal">ours</text>
<rect x="100" y="8" width="16" height="14" rx="3" fill="#e9e8e3" stroke="#8a8983" stroke-width="1.3"/>
<text x="122" y="20" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-style="normal">as in MeshSplatting</text>
